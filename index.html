<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핑퐁">
<title>핑퐁</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --beige:#F5F3EE;
    --navy:#1E4D6B;
    --orange:#B8722F;
    --purple:#6E3D6E;
    --yellow:#FFE9A8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--beige);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:fixed;
    inset:0;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas{display:block;width:100%;height:100%;}

  #mute{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 10px);
    left:calc(env(safe-area-inset-left) + 12px);
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid rgba(30,77,107,.28);
    border-radius:50%;
    background:transparent;
    color:var(--navy);
    font-family:inherit;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  #mute[data-off="1"]{opacity:.42;}
  #mute:focus-visible{outline:3px solid var(--orange);outline-offset:3px;}

  #overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:rgba(245,243,238,.88);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
  }
  #overlay[hidden]{display:none;}
  #headline{
    font-size:38px;
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--navy);
    line-height:1.1;
  }
  #sub{
    font-size:15px;
    font-weight:500;
    color:var(--navy);
    opacity:.62;
    text-align:center;
    line-height:1.6;
  }
  #action{
    margin-top:6px;
    padding:15px 40px;
    border:none;
    border-radius:999px;
    background:var(--navy);
    color:var(--beige);
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
    cursor:pointer;
  }
  #action:focus-visible{outline:3px solid var(--orange);outline-offset:3px;}
  #action:active{transform:scale(.97);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" data-off="0" aria-label="소리 끄기">♪</button>
  <div id="overlay">
    <div id="headline">핑퐁</div>
    <div id="sub">아래쪽 막대를 손가락으로 좌우로 움직이세요<br>먼저 5점을 내면 이깁니다</div>
    <button id="action">시작</button>
  </div>
</div>

    const n = 24, re = new Float32Array(n), im = new Float32Array(n);

      // 펄스2 — 16분음표로 코드를 흩뿌리는 NES 특유의 아르페지오
      const c = CHORD[bar];
      chip(t, hz(c[s % 3]), spb * 0.7, 0.075, 25);

      // 삼각파 베이스 — 옥타브를 오가는 8분음표
      if(s % 2 === 0) chip(t, hz(ROOT[bar] + (s % 4 === 2 ? 12 : 0)), spb * 1.8, 0.55, 'tri');

      // 노이즈 타악기
      if(KICK.indexOf(s) > -1) drum(t, 0.10, 0.85, 'kick');
      if(SNARE.indexOf(s) > -1) drum(t, 0.11, 0.30, 'snare');
      if(s % 2 === 0) drum(t, s % 4 === 0 ? 0.035 : 0.022, s % 4 === 0 ? 0.11 : 0.06, 'hat');

      nextTime += spb;
      step++;
    }
  }

  return {
    unlock: init,
    startMusic: function(){
      init(); if(!ctx || timer) return;
      step = 0; nextTime = ctx.currentTime + 0.06;
      timer = setInterval(schedule, 25);
    },
    stopMusic: function(){ if(timer){ clearInterval(timer); timer = null; } },
    tempo: function(mul){ bpm = 150 + (mul - 1) * 52; },
    paddle: function(){ if(ctx) chip(ctx.currentTime, 700, 0.06, 0.42, 12, sfxBus, 1150); },
    wall:   function(){ if(ctx) chip(ctx.currentTime, 340, 0.05, 0.30, 25, sfxBus); },
    won:    function(){ if(ctx) [988, 1319].forEach(function(f,i){ chip(ctx.currentTime + i*0.075, f, 0.10, 0.40, 12, sfxBus); }); },
    lost:   function(){ if(ctx) chip(ctx.currentTime, 300, 0.30, 0.35, 25, sfxBus, 130); },
    fanfare: function(up){
      if(!ctx) return;
      const seq = up ? [72,76,79,84,88] : [76,72,68,64];
      seq.forEach(function(m,i){ chip(ctx.currentTime + i*0.12, hz(m), 0.26, 0.32, 12, sfxBus); });
    },
    toggle: function(){
      init();
      muted = !muted;
      if(master) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.02);
      return muted;
    }
  };
})();
</script>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const headline = document.getElementById('headline');
  const sub = document.getElementById('sub');
  const action = document.getElementById('action');

  const face = new Image();
  let faceReady = false;
  face.onload = function(){ faceReady = true; };
  face.src = FACE_SRC;

  const WIN_SCORE = 5;
  const MAX_ANGLE = 1.05;          // 패들 가장자리 반사각 (약 60도)
  const SPEED_STEP = 1.055;        // 한 번 칠 때마다 빨라지는 비율
  const SPEED_CAP  = 1.95;

  let W = 0, H = 0;
  let state = 'ready';             // ready | serve | play | over
  let serveTimer = 0;
  let flash = 0;                   // 타격 순간 잔상

  const score = { me:0, cpu:0 };
  const ball = { x:0, y:0, vx:0, vy:0, r:8, speed:0, mul:1 };
  const me  = { x:0, y:0, w:0, h:12 };
  const cpu = { x:0, y:0, w:0, h:12, err:0 };

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = rect.width; H = rect.height;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const pw = Math.max(70, Math.min(W * 0.24, 150));
    me.w = cpu.w = pw;
    me.h = cpu.h = Math.max(11, H * 0.016);
    me.y  = H - H * 0.085;
    cpu.y = H * 0.085;
    ball.r = Math.max(6, W * 0.022);

    me.x  = clamp(me.x  || W/2, pw/2, W - pw/2);
    cpu.x = clamp(cpu.x || W/2, pw/2, W - pw/2);
    if(state === 'ready') resetBall(1);
  }

  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }

  function resetBall(dir){
    ball.mul = 1;
    ball.speed = H * 0.62;
    ball.x = W / 2;
    ball.y = H / 2;
    const a = (Math.random() * 0.5 - 0.25);
    ball.vx = Math.sin(a) * ball.speed;
    ball.vy = Math.cos(a) * ball.speed * dir;
    cpu.err = (Math.random() * 2 - 1) * cpu.w * 0.55;
  }

  function startMatch(){
    score.me = 0; score.cpu = 0;
    resetBall(Math.random() < 0.5 ? 1 : -1);
    state = 'serve';
    serveTimer = 0.7;
    overlay.hidden = true;
    Snd.tempo(1);
    Snd.startMusic();
  }

  function point(who){
    score[who]++;
    if(navigator.vibrate) navigator.vibrate(who === 'me' ? 18 : 8);
    if(score[who] >= WIN_SCORE){
      state = 'over';
      const won = who === 'me';
      Snd.stopMusic();
      Snd.fanfare(won);
      headline.textContent = won ? '이겼습니다' : '졌습니다';
      sub.innerHTML = score.me + ' : ' + score.cpu;
      action.textContent = '다시 하기';
      overlay.hidden = false;
      return;
    }
    if(who === 'me') Snd.won(); else Snd.lost();
    Snd.tempo(1);
    resetBall(who === 'me' ? 1 : -1);   // 점수를 잃은 쪽으로 서브
    state = 'serve';
    serveTimer = 0.7;
  }

  function bounceOff(p, goingUp){
    const off = clamp((ball.x - p.x) / (p.w / 2), -1, 1);
    const ang = off * MAX_ANGLE;
    ball.mul = Math.min(ball.mul * SPEED_STEP, SPEED_CAP);
    const s = ball.speed * ball.mul;
    ball.vx = Math.sin(ang) * s;
    ball.vy = Math.cos(ang) * s * (goingUp ? -1 : 1);
    flash = 1;
    Snd.paddle();
    Snd.tempo(ball.mul);
    if(navigator.vibrate) navigator.vibrate(6);
  }

  function update(dt){
    if(state === 'serve'){
      serveTimer -= dt;
      if(serveTimer <= 0) state = 'play';
      return;
    }
    if(state !== 'play') return;

    // 컴퓨터 — 쉬움: 공이 올라올 때만 느리게 따라감
    const chasing = ball.vy < 0;
    const target = chasing ? ball.x + cpu.err : W / 2;
    const cpuSpeed = (chasing ? H * 0.30 : H * 0.16) * dt;
    const d = target - cpu.x;
    cpu.x += clamp(d, -cpuSpeed, cpuSpeed);
    cpu.x = clamp(cpu.x, cpu.w / 2, W - cpu.w / 2);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 좌우 벽
    if(ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); Snd.wall(); }
    if(ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); Snd.wall(); }

    // 내 막대
    if(ball.vy > 0 && ball.y + ball.r >= me.y && ball.y - ball.r <= me.y + me.h){
      if(Math.abs(ball.x - me.x) <= me.w / 2 + ball.r){
        ball.y = me.y - ball.r;
        bounceOff(me, true);
      }
    }
    // 컴퓨터 막대
    if(ball.vy < 0 && ball.y - ball.r <= cpu.y + cpu.h && ball.y + ball.r >= cpu.y){
      if(Math.abs(ball.x - cpu.x) <= cpu.w / 2 + ball.r){
        ball.y = cpu.y + cpu.h + ball.r;
        bounceOff(cpu, false);
        cpu.err = (Math.random() * 2 - 1) * cpu.w * 0.55;
      }
    }

    if(ball.y - ball.r > H) point('cpu');
    else if(ball.y + ball.r < 0) point('me');

    if(flash > 0) flash = Math.max(0, flash - dt * 4);
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // 배경 — 화면을 꽉 채운 얼굴
    if(faceReady){
      const sc = Math.min(W / face.width, H / face.height) * 0.99;
      const dw = face.width * sc, dh = face.height * sc;
      ctx.globalAlpha = 0.26;
      ctx.drawImage(face, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.globalAlpha = 1;
    }

    // 점수 — 오른쪽 위 (보라는 컴퓨터, 주황은 나)
    const fs = Math.max(20, Math.min(W * 0.075, 32));
    const px = W - 18, py = Math.max(fs * 0.8, H * 0.042);
    ctx.font = '800 ' + fs + 'px Pretendard, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#B8722F';
    ctx.fillText(score.me, px, py);
    const wMe = ctx.measureText(String(score.me)).width;
    ctx.fillStyle = 'rgba(30,77,107,.40)';
    ctx.fillText(':', px - wMe - 7, py);
    const wCol = ctx.measureText(':').width;
    ctx.fillStyle = '#6E3D6E';
    ctx.fillText(score.cpu, px - wMe - wCol - 14, py);
    ctx.textAlign = 'center';

    // 중앙선
    ctx.strokeStyle = 'rgba(30,77,107,.22)';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 11]);
    ctx.beginPath();
    ctx.moveTo(0, H / 2);
    ctx.lineTo(W, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 막대
    ctx.fillStyle = 'var';
    ctx.fillStyle = '#6E3D6E';
    roundRect(cpu.x - cpu.w / 2, cpu.y, cpu.w, cpu.h, cpu.h / 2);
    ctx.fillStyle = '#B8722F';
    roundRect(me.x - me.w / 2, me.y, me.w, me.h, me.h / 2);

    // 공
    if(flash > 0){
      ctx.fillStyle = 'rgba(255,233,168,' + (flash * 0.85) + ')';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r + 10 * flash, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#1E4D6B';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  let last = 0;
  function loop(t){
    if(!last) last = t;
    const dt = Math.min((t - last) / 1000, 0.033);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 조작
  function movePaddle(clientX){
    const rect = canvas.getBoundingClientRect();
    me.x = clamp(clientX - rect.left, me.w / 2, W - me.w / 2);
  }
  canvas.addEventListener('touchstart', e => { movePaddle(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { movePaddle(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('mousemove',  e => movePaddle(e.clientX));

  action.addEventListener('click', startMatch);

  ['pointerdown','touchstart'].forEach(ev =>
    window.addEventListener(ev, () => Snd.unlock(), {passive:true}));
  document.addEventListener('visibilitychange', () => { if(!document.hidden) Snd.unlock(); });

  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    const off = Snd.toggle();
    muteBtn.dataset.off = off ? '1' : '0';
    muteBtn.textContent = off ? '♪̸' : '♪';
    muteBtn.setAttribute('aria-label', off ? '소리 켜기' : '소리 끄기');
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
